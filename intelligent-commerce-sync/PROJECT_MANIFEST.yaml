project:
  name: Intelligent Product Sync Platform
  source: JakMall
  marketplace: Shopee
  language: id-ID
  architecture: modular-monolith

core_flow:
  extraction: true
  normalization: true
  marketplace_mapping: true
  review: true
  marketplace_listing: false
  verification: false

source:
  primary_strategy: static-http
  embedded_state: spdt
  fallback:
    - json-ld
    - playwright

database:
  engine: postgresql

queue:
  engine: redis-bullmq

ai:
  role: semantic-intelligence
  business_logic_authority: false

documentation:
  documentation_as_code: true

managed_files:
  - PROJECT_CHECKLIST.md
  - PROJECT_MANIFEST.yaml
  - README.md
  - package.json
  - tsconfig.json
  - .env.example
  - src/index.ts
  - src/canonical/types.ts
  - src/jakmall/types.ts
  - src/jakmall/client.ts
  - src/jakmall/parser.ts
  - src/jakmall/normalizer.ts
  - src/jakmall/adapter.ts
  - src/marketplace/types.ts
  - src/marketplace/shopee/types.ts
  - src/marketplace/shopee/policy.ts
  - src/marketplace/shopee/mapper.ts
  - src/marketplace/shopee/builder.ts
  - src/marketplace/shopee/adapter.ts
  - src/marketplace/shopee/verifier.ts
  - scripts/test-jakmall.ts
  - scripts/test-shopee-draft.ts
  - tests/client.test.ts
  - tests/parser.test.ts
  - tests/normalizer.test.ts
  - tests/regression.test.ts
  - tests/marketplace-policy.test.ts
  - tests/shopee-mapper.test.ts
  - tests/shopee-builder.test.ts
  - tests/shopee-adapter.test.ts
  - tests/shopee-verifier.test.ts
  - tests/fixtures/README.md
  - tests/fixtures/acmic.html
  - tests/fixtures/momo.html
  - tests/fixtures/asv.html
  - docs/project-status.md
  - docs/known-limitations.md
  - docs/source/jakmall-extraction.md
  - docs/source/extraction-findings.md
  - docs/product/canonical-product.md
  - docs/product/field-ownership.md
  - docs/architecture/system-overview.md
  - docs/marketplace/shopee-integration.md
