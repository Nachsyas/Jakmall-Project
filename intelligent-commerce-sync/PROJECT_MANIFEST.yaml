project:
  name: Intelligent Product Sync Platform
  source: JakMall
  marketplace: Shopee
  language: id-ID
  architecture: modular-monolith

core_flow:
  extraction: true
  normalization: true
  marketplace_mapping: true
  review: true
  marketplace_listing: false
  verification: false

source:
  primary_strategy: static-http
  embedded_state: spdt
  fallback:
    - json-ld
    - playwright

database:
  engine: postgresql
  orm: prisma
  schema_defined: true
  schema_validated: true
  connected: true
  migration_applied: true

synchronization:
  planner_defined: true
  state_machine_defined: true
  field_ownership_policy_defined: true
  runtime_active: false

queue:
  engine: redis-bullmq
  active: true

ai:
  role: semantic-intelligence
  business_logic_authority: false

documentation:
  documentation_as_code: true

